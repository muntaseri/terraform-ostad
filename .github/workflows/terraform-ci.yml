name: Terraform CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false

  plan:
    name: Dev plan and PR summary
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_ROLE_TO_ASSUME != ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: terraform-pr-plan

      - name: Initialize without a backend
        run: terraform init -backend=false -input=false

      - name: Create dev plan
        run: terraform plan -refresh=false -input=false -no-color -var-file=dev.tfvars -out=tfplan

      - name: Summarize plan without exposing plan details
        id: plan-summary
        run: |
          terraform show -json tfplan | jq -r '
            [.resource_changes[]?.change.actions] as $actions |
            "Adds: \([$actions[] | select(index("create"))] | length)\n" +
            "Changes: \([$actions[] | select(index("update"))] | length)\n" +
            "Destroys: \([$actions[] | select(index("delete"))] | length)\n" +
            "Replacements: \([$actions[] | select(index("create") and index("delete"))] | length)"
          ' > summary.txt
          {
            echo 'summary<<EOF'
            cat summary.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan summary on pull request
        uses: actions/github-script@v7
        env:
          PLAN_SUMMARY: ${{ steps.plan-summary.outputs.summary }}
        with:
          script: |
            const marker = '<!-- terraform-dev-plan-summary -->';
            const body = [
              marker,
              '## Terraform dev plan summary',
              '',
              'This is a plan-only run using `dev.tfvars` with backend and refresh disabled. It has **no remote state**, so the counts are calculated from an empty state rather than compared against deployed infrastructure. No resources were applied and no raw plan or sensitive values are included.',
              '',
              '```text',
              process.env.PLAN_SUMMARY,
              '```',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  plan-not-configured:
    name: AWS plan not configured
    needs: checks
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_ROLE_TO_ASSUME == ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Explain why the plan was skipped
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- terraform-dev-plan-summary -->';
            const body = [
              marker,
              '## Terraform dev plan summary',
              '',
              'The AWS plan was skipped because the repository variable `AWS_ROLE_TO_ASSUME` is not configured. Static validation, TFLint, and Checkov still ran.',
              '',
              'Configure the repository variable with the ARN of a read-only AWS role trusted for this repository pull-request workflow to enable same-repository pull request plans. Forked pull requests never receive AWS credentials.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
